<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Clicker</title>
<style>
  :root {
    --case: #f7f8f6;
    --ink: #24313a;
    --screen: #aeb69c;
    --screen-dark: #26312d;
    --key: #f8faf9;
    --shadow: #c9d0d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 22px; background: radial-gradient(ellipse at 50% 25%, #3a4650, #111820 75%);
    font-family: Arial, Helvetica, sans-serif; color: var(--ink);
  }
  .calculator {
    width: min(430px, 96vw); padding: 28px 25px 34px; border-radius: 48px;
    background: linear-gradient(145deg, #ffffff, #e9eeec);
    box-shadow: 0 24px 55px #0008, inset 0 2px 4px #fff;
    border: 1px solid #d8dfdf;
  }
  .display {
    min-height: 104px; padding: 12px 14px 8px; border-radius: 13px;
    background: var(--screen); border: 5px solid #e0e5e1;
    box-shadow: inset 0 3px 9px #0003; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
  }
  .display-label { font-size: 11px; letter-spacing: 2px; color: #3b493d; font-weight: 700; }
  #clickCount {
    display: block; width: 100%; text-align: right; color: var(--screen-dark);
    font-family: "Courier New", monospace; font-size: clamp(29px, 8vw, 43px);
    font-weight: 900; line-height: 1.2; overflow: hidden; text-overflow: clip;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .solar-row { display: flex; justify-content: flex-end; margin: 19px 3px 20px; }
  .rebirth-panel {
    min-width: 116px; height: 39px; padding: 5px 12px; border-radius: 7px;
    background: #303638; border: 3px solid #dce1df; color: #e8f0df;
    box-shadow: inset 0 2px 5px #0008; text-align: center;
    font: 700 13px/23px "Courier New", monospace; letter-spacing: .5px;
  }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px 12px; }
  button {
    min-width: 0; height: 67px; border: 1px solid #cbd3d2; border-radius: 15px;
    background: linear-gradient(145deg, #fff, #edf1f0); color: var(--ink);
    font-size: 23px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 0 var(--shadow), 0 5px 8px #00000012, inset 0 1px 1px #fff;
    transition: transform .08s, box-shadow .08s, filter .15s;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
  button:focus-visible { outline: 3px solid #7198bd; outline-offset: 2px; }
  .click-key {
    background: linear-gradient(145deg, #fff, #e1eee7); border-color: #b8cbc0;
    color: #1d6545; font-size: 29px;
  }
  .rebirth-key {
    background: linear-gradient(145deg, #fff, #e9e5f3); border-color: #c9c1dc;
    font-size: 14px; line-height: 1.15; color: #55447c;
  }
  .rebirth-key span { display: block; font-size: 22px; margin-bottom: 2px; }
  .muted-key { cursor: default; }
  .muted-key:active { transform: none; box-shadow: 0 4px 0 var(--shadow), 0 5px 8px #00000012, inset 0 1px 1px #fff; }
  .message {
    min-height: 42px; margin: 20px 3px 0; text-align: center;
    font-size: 13px; line-height: 1.45; color: #4b5960;
  }
  .progress-wrap { margin: 8px 4px 0; }
  .progress-info { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: #536068; margin-bottom: 6px; }
  .progress { height: 8px; border-radius: 20px; background: #dce2df; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #6baf87, #33865e); border-radius: inherit; transition: width .2s; }
  .reset {
    display: block; margin: 12px auto 0; border: 0; background: transparent;
    box-shadow: none; height: auto; padding: 5px 10px; font-size: 11px;
    color: #778187; text-decoration: underline;
  }
  .reset:active { transform: none; box-shadow: none; }
  @media (max-width: 380px) {
    .calculator { padding: 22px 17px 27px; border-radius: 38px; }
    .keys { gap: 11px 9px; }
    button { height: 59px; border-radius: 13px; }
  }
</style>
</head>
<body>
<main class="calculator" aria-label="Calculadora Clicker">
  <section class="display" aria-live="polite">
    <span class="display-label">CLICKS</span>
    <strong id="clickCount">0</strong>
  </section>

  <div class="solar-row">
    <div class="rebirth-panel" id="rebirthPanel">REBIRTH: 1</div>
  </div>

  <section class="keys" aria-label="Teclas">
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">√</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">%</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">CE</button>
    <button class="rebirth-key" id="rebirthButton" type="button" aria-label="Rebirth"><span>ON</span>AC</button>

    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">MC</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">MR</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">M−</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">M+</button>

    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">7</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">8</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">9</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">÷</button>

    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">4</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">5</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">6</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">×</button>

    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">1</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">2</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">3</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">−</button>

    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">0</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">.</button>
    <button class="click-key" id="clickButton" type="button" aria-label="Hacer click">=</button>
    <button class="muted-key" type="button" tabindex="-1" aria-hidden="true">+</button>
  </section>

  <div class="progress-wrap">
    <div class="progress-info"><span id="nextLabel">Siguiente rebirth: 1.000</span><span id="progressText">0%</span></div>
    <div class="progress"><div id="progressFill"></div></div>
  </div>
  <p class="message" id="message">¡Bienvenido! Tu primer rebirth ya está desbloqueado. Pulsa = para ganar clicks.</p>
  <button class="reset" id="resetButton" type="button">Reiniciar partida</button>
</main>

<script>
(() => {
  const SAVE_KEY = "calculatorClickerSave_v1";
  const knownRequirements = { 2: 1000, 3: 5000, 4: 15000, 5: 30000 };

  // Desde el rebirth 6 en adelante, el requisito crece un 50% por nivel.
  // Los requisitos conocidos (2 al 5) se mantienen exactamente como fueron definidos.
  function requirementFor(rebirthToReach) {
    if (knownRequirements[rebirthToReach]) return knownRequirements[rebirthToReach];
    if (rebirthToReach > 5) return Math.ceil(30000 * Math.pow(1.5, rebirthToReach - 5));
    return 0;
  }

  let state = { clicks: 0, rebirths: 1 };
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (saved && Number.isFinite(saved.clicks) && Number.isFinite(saved.rebirths)) {
      state.clicks = Math.max(0, Math.floor(saved.clicks));
      state.rebirths = Math.max(1, Math.floor(saved.rebirths));
    }
  } catch (_) {}

  const clickCount = document.getElementById("clickCount");
  const rebirthPanel = document.getElementById("rebirthPanel");
  const message = document.getElementById("message");
  const nextLabel = document.getElementById("nextLabel");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const clickButton = document.getElementById("clickButton");
  const rebirthButton = document.getElementById("rebirthButton");

  const format = n => Math.floor(n).toLocaleString("es-CL");

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (_) {}
  }

  function render() {
    const target = state.rebirths + 1;
    const needed = requirementFor(target);
    const percent = Math.min(100, state.clicks / needed * 100);

    clickCount.textContent = format(state.clicks);
    rebirthPanel.textContent = "REBIRTH: " + format(state.rebirths);
    nextLabel.textContent = "Siguiente rebirth: " + format(needed);
    progressText.textContent = Math.floor(percent) + "%";
    progressFill.style.width = percent + "%";
    rebirthButton.title = `Necesitas ${format(needed)} clicks para el rebirth ${format(target)}.`;
  }

  clickButton.addEventListener("click", () => {
    // El valor de cada click equivale al número de rebirths actuales.
    state.clicks += state.rebirths;
    save();
    render();
    message.textContent = `+${format(state.rebirths)} clicks. ¡Sigue así!`;
  });

  rebirthButton.addEventListener("click", () => {
    const target = state.rebirths + 1;
    const needed = requirementFor(target);

    if (state.clicks < needed) {
      const missing = needed - state.clicks;
      message.textContent = `Te faltan ${format(missing)} clicks para conseguir el rebirth ${format(target)}.`;
      return;
    }

    state.rebirths = target;
    state.clicks = 0;
    save();
    render();
    message.textContent = `¡REBIRTH ${format(state.rebirths)} conseguido! Ahora cada click vale ${format(state.rebirths)} clicks.`;
  });

  document.getElementById("resetButton").addEventListener("click", () => {
    if (!confirm("¿Seguro que quieres reiniciar? Perderás tus clicks y rebirths.")) return;
    state = { clicks: 0, rebirths: 1 };
    save();
    render();
    message.textContent = "Partida reiniciada. Tu primer rebirth ya está desbloqueado.";
  });

  render();
})();
</script>
</body>
</html>
